<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>HillsByte Admin</title><style>body{font-family:system-ui;background:#07100b;color:#eee;max-width:1000px;margin:auto;padding:20px}input,button{padding:10px;background:#0d1912;color:#fff;border:1px solid #284333;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#0d1912;border:1px solid #1d3427;border-radius:12px;padding:15px;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #1d3427;text-align:left;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}table{font-size:11px}}</style></head><body><h1>HillsByte Admin</h1><input id="key" type="password" placeholder="Admin key"><button onclick="load()">Load</button><div id="stats" class="grid"></div><div class="card"><h2>Withdrawals</h2><div id="rows">Enter admin key.</div></div><script>async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json','x-admin-key':key.value}}),d=await r.json();if(!r.ok)throw Error(d.error||'Failed');return d}async function load(){try{const s=await api('/api/admin/overview');stats.innerHTML=`<div class=card><b>${s.users}</b><br>Users</div><div class=card><b>${s.pendingWithdrawals}</b><br>Pending</div><div class=card><b>$${Number(s.paidWithdrawals).toFixed(2)}</b><br>Paid total</div>`;const d=await api('/api/admin/withdrawals');rows.innerHTML='<table><tr><th>ID</th><th>User</th><th>Amount</th><th>Address</th><th>Status</th><th>Action</th></tr>'+d.withdrawals.map(w=>`<tr><td>${w.id}</td><td>${w.username||w.telegram_id}</td><td>$${Number(w.amount).toFixed(2)}</td><td style="word-break:break-all">${w.payment_address}</td><td>${w.status}</td><td><button onclick="setStatus(${w.id},'paid')">Paid</button> <button onclick="setStatus(${w.id},'rejected')">Reject</button></td></tr>`).join('')+'</table>'}catch(e){rows.textContent=e.message}}async function setStatus(id,status){await api('/api/admin/withdrawals/'+id+'/status',{method:'POST',body:JSON.stringify({status})});load()}</script></body></html>
