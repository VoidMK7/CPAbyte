<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06100c">
  <meta name="color-scheme" content="dark">
  <title>HillsByte</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-scene">
      <div class="splash-orb"><span>H</span></div>
      <i class="orbit orbit-1"></i><i class="orbit orbit-2"></i><i class="orbit orbit-3"></i>
      <i class="particle p1"></i><i class="particle p2"></i><i class="particle p3"></i><i class="particle p4"></i>
    </div>
    <div class="splash-title">HillsByte</div>
    <div class="splash-sub">Earn. Complete. Grow.</div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"><span class="icon icon-menu"></span></button>
      <div class="brand"><span class="brand-dot">H</span><span>HillsByte</span></div>
      <button class="icon-btn notification-button" id="notifBtn" aria-label="Notifications"><span class="icon icon-bell"></span><b id="notifDot">1</b></button>
    </header>

    <aside class="drawer" id="drawer" aria-label="Navigation">
      <div class="drawer-head"><div class="brand"><span class="brand-dot">H</span><span>HillsByte</span></div><button class="icon-btn" id="closeDrawer" aria-label="Close menu"><span class="icon icon-close"></span></button></div>
      <nav id="drawerNav"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main id="view"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-route="earn"><span class="icon icon-spark"></span><small>Earn</small></button>
      <button data-route="wallet"><span class="icon icon-wallet"></span><small>Wallet</small></button>
      <button data-route="community"><span class="icon icon-users"></span><small>Community</small></button>
      <button data-route="profile"><span class="icon icon-user"></span><small>Profile</small></button>
    </nav>
  </div>

  <div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
