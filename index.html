<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06110e" />
  <meta name="description" content="HillsByte Telegram earning mini app" />
  <title>HillsByte</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="splash" class="splash">
    <div class="orbital-scene">
      <div class="orbital-ring ring-a"></div>
      <div class="orbital-ring ring-b"></div>
      <div class="orbital-core"><span>H</span></div>
      <div class="spark spark-a"></div><div class="spark spark-b"></div><div class="spark spark-c"></div>
    </div>
    <div class="splash-brand">HillsByte</div>
    <div class="splash-sub">Earn • Complete • Grow</div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Open menu"><span class="i i-menu"></span></button>
      <div class="brand"><span class="brand-mark">H</span><span>HillsByte</span></div>
      <button id="notifBtn" class="icon-btn notification-btn" aria-label="Notifications">
        <span class="i i-bell"></span><b id="notifDot" class="notif-dot"></b>
      </button>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav">
      <button data-page="dashboard" class="nav-item active"><span class="i i-spark"></span><small>Earn</small></button>
      <button data-page="wallet" class="nav-item"><span class="i i-wallet"></span><small>Wallet</small></button>
      <button data-page="community" class="nav-item"><span class="i i-users"></span><small>Community</small></button>
      <button data-page="profile" class="nav-item"><span class="i i-user"></span><small>Profile</small></button>
    </nav>
  </div>

  <aside id="sideMenu" class="side-menu">
    <div class="side-head"><div class="brand"><span class="brand-mark">H</span><span>HillsByte</span></div><button id="closeMenu" class="icon-btn"><span class="i i-x"></span></button></div>
    <button data-page="dashboard" class="side-link"><span class="i i-grid"></span>Dashboard</button>
    <button data-page="earn" class="side-link"><span class="i i-spark"></span>Earn</button>
    <button data-page="activity" class="side-link"><span class="i i-activity"></span>Activity</button>
    <button data-page="wallet" class="side-link"><span class="i i-wallet"></span>Wallet</button>
    <button data-page="referrals" class="side-link"><span class="i i-users"></span>Referrals</button>
    <button data-page="community" class="side-link"><span class="i i-community"></span>Community</button>
    <button data-page="events" class="side-link"><span class="i i-calendar"></span>Events</button>
    <button data-page="leaderboard" class="side-link"><span class="i i-trophy"></span>Leaderboard</button>
    <button data-page="notifications" class="side-link"><span class="i i-bell"></span>Notifications</button>
    <button data-page="profile" class="side-link"><span class="i i-user"></span>Profile</button>
    <button data-page="admin" class="side-link admin-link"><span class="i i-shield"></span>Admin</button>
  </aside>
  <div id="menuShade" class="menu-shade"></div>

  <div id="modalRoot"></div>
  <button id="aiFab" class="ai-fab" aria-label="Open HillsByte AI"><span class="i i-ai"></span></button>

  <script src="//libtl.com/sdk.js" data-zone="11725898" data-sdk="show_11725898"></script>
  <script src="/app.js"></script>
</body>
</html>
