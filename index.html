<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEXA Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#080b12;--card:#111827;--muted:#8b95a7;--text:#f7f9fc;--accent:#7c5cff;--accent2:#23d5ab;--line:#20283a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b1740 0,#080b12 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:18px 16px 34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:.5px}.pill{font-size:12px;color:#c9c3ff;background:#241e4d;border:1px solid #3d3475;border-radius:999px;padding:7px 10px}
.hero{background:linear-gradient(135deg,#17132f,#121827);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px #0007}.hello{color:var(--muted);font-size:14px}.balance{font-size:42px;font-weight:900;margin:5px 0}.coin{color:#b8b0ff;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#0d1320;border:1px solid var(--line);border-radius:16px;padding:13px 10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.section{margin-top:16px;background:#0e1420;border:1px solid var(--line);border-radius:20px;padding:16px}.section h2{font-size:16px;margin:0 0 7px}.section p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px}.btn{width:100%;border:0;border-radius:15px;padding:15px 16px;font-size:15px;font-weight:800;color:white;background:linear-gradient(135deg,var(--accent),#5f43d9);cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.alt{background:#172033;border:1px solid #2a354a}.status{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}.verified{color:var(--accent2)}.danger{color:#ff8c8c}.footer{padding:18px 4px;text-align:center;color:#667085;font-size:11px}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">NEXA</div><div class="pill">Rewards</div></div>
<div class="hero"><div class="hello" id="hello">Connecting Telegram…</div><div class="balance" id="balance">—</div><div class="coin" id="coin">Nexa Coin</div>
<div class="grid"><div class="stat"><b id="level">—</b><span>Level</span></div><div class="stat"><b id="streak">—</b><span>Streak</span></div><div class="stat"><b id="days">—</b><span>Active days</span></div></div></div>
<div class="section"><h2>📺 Watch Ads</h2><p>Watch a rewarded AdsGram ad to earn Nexa Coin. Channel membership is required.</p><button class="btn" id="adBtn" disabled>Loading…</button><div class="status" id="status"></div></div>
<div class="section"><h2>🔒 Earning access</h2><p id="channelText">Checking your NEXA channel membership…</p><button class="btn alt" id="refreshBtn">Refresh account</button></div>
<div class="footer">NEXA Rewards · Powered by Supabase + AdsGram</div>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const API='https://dnunclktqlnimdzvrcwg.supabase.co/functions/v1';
let session=null, ad=null;
const $=id=>document.getElementById(id);
async function load(){
  if(!tg?.initData){$('status').textContent='Open NEXA from Telegram to continue.';$('status').className='status danger';return;}
  $('status').textContent='Checking account…';
  try{const r=await fetch(API+'/mini-app-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify Telegram');session=d;
    $('hello').textContent='Welcome, '+d.user.firstName+' 👋';$('balance').textContent=Number(d.balance).toLocaleString();$('coin').textContent=d.coinName;$('level').textContent=d.level;$('streak').textContent=d.streak;$('days').textContent=d.activeDays;
    if(d.ads.channelVerified){$('channelText').innerHTML='<span class="verified">✓ Channel membership verified. Earning is unlocked.</span>';}else{$('channelText').textContent='Join the required NEXA channel, then refresh this account.';}
    $('adBtn').disabled=!d.ads.channelVerified||!d.ads.enabled||d.ads.claimedThisHour;$('adBtn').textContent=d.ads.claimedThisHour?'Claimed this hour':(d.ads.enabled?'Watch Ad +'+d.ads.reward:'Ads unavailable');
    if(d.ads.enabled&&d.ads.channelVerified&&!d.ads.claimedThisHour){try{ad=window.Adsgram.init({blockId:'46004'});}catch(e){$('status').textContent='AdsGram is not ready yet.';}}
    $('status').textContent=d.ads.claimedThisHour?'Reward already claimed this hour.':'Ready.';
  }catch(e){$('status').textContent=e.message;$('status').className='status danger';}
}
$('refreshBtn').onclick=load;
$('adBtn').onclick=async()=>{if(!ad||!session)return;$('adBtn').disabled=true;$('status').textContent='Loading ad…';try{const result=await ad.show();$('status').textContent='Ad completed. Confirming reward…';const r=await fetch(API+'/mini-app-reward',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Reward failed');$('status').textContent=d.rewarded?'+'+d.amount+' Nexa Coin added to your balance.':'Reward already claimed.';setTimeout(load,900);}catch(e){$('status').textContent=e?.message||'Ad was not completed.';$('adBtn').disabled=false;}};
load();
</script></body></html>
