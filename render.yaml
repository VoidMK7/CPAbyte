services:
  - type: web
    name: hillsbyte
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      - key: DB_PATH
        value: ./data/hillsbyte.db
